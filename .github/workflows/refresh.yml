name: refresh profile

on:
  schedule:
    # 05:00 UTC daily.
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # ref: main, not the default github.sha, so a run queued behind another
      # one (schedule plus a manual dispatch landing seconds apart, say)
      # checks out whatever main is by the time it actually starts rather
      # than the stale commit that was current when it was queued.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A single flaky source must not blank a section, so the script keeps the
      # last good values and exits non zero. Commit whatever it did produce,
      # then fail the job afterwards so the run still shows red.
      - name: Generate cards and README blocks
        id: generate
        continue-on-error: true
        run: node scripts/refresh.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "Refresh generated profile cards and post list"
          # ref: main above already narrows this, but belt and suspenders:
          # if another run still won the push, replay ours on top rather
          # than fail outright. Every file here is fully regenerated, not
          # hand edited, so "ours" is a safe conflict resolution.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt, rebasing onto the latest main"
            git fetch origin main
            git rebase -X ours origin/main
          done
          echo "still rejected after 3 attempts"
          exit 1

      - name: Surface source failures
        if: steps.generate.outcome == 'failure'
        run: |
          echo "refresh.mjs reported at least one failing source, see the step above"
          exit 1
